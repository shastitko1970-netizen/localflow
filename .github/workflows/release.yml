name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build installer + updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Compose latest.json
        shell: pwsh
        run: |
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          $sigPath = "$($nsis.FullName).sig"
          if (-not (Test-Path $sigPath)) { throw "Missing signature file: $sigPath" }
          $sig = (Get-Content $sigPath -Raw).Trim()
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $url = "https://github.com/shastitko1970-netizen/localflow/releases/download/v$version/$($nsis.Name)"
          $json = @{
            version = $version
            notes = "LocalFlow $version"
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = @{
              "windows-x86_64" = @{
                signature = $sig
                url = $url
              }
            }
          } | ConvertTo-Json -Depth 5
          $out = "src-tauri/target/release/bundle/nsis/latest.json"
          Set-Content -Path $out -Value $json -Encoding utf8
          Write-Host $json

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
